<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Panda House 🐼</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card house-card">

<div class="house">
🏠
</div>

<div class="panda-house">
🐼
</div>

<h1>
Welcome To Panda House 🌸
</h1>

<p>
A tiny cute place filled with happiness,
flowers and smiles ✨
</p>

<div class="toys">
🧸 🌸 🦋 ⭐
</div>

<button onclick="location.href='letter.html'">
Read Panda Letter 💌
</button>

</div>
<div class="panda-player">

<div class="panda-face" id="panda">
🐼🎧
</div>

<button onclick="toggleMusic()" id="musicBtn">
▶️ Play
</button>

<input 
type="range" 
id="volume"
min="0"
max="1"
step="0.1"
value="0.5">

<audio id="music" loop>
<source src="music/song.wav" type="audio/wav">
</audio>

</div>

<script src="script.js"></script>
</body>
</html>
<button onclick="location.href='garden.html'">
Enter Magic Garden 🌈
</button>
<button onclick="location.href='gift.html'">
Open Secret Gift 🎁
</button>
