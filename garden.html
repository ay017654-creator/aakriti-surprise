<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Magic Garden 🌸</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card garden-card">

<div class="garden-items">
🌳 🌸 🦋
</div>

<div class="panda-garden">
🐼
</div>

<h1>
✨ Magical Garden ✨
</h1>

<p>
Dear Aakriti ❤️
</p>

<p>
This little world was created with smiles,
care and happiness just for you 🌸
</p>

<h2>
Keep Shining Always ⭐
</h2>

<div class="garden-items">
🌺 🧸 💖 🌈
</div>

<button onclick="location.href='index.html'">
Start Again 🏠
</button>

</div>
<div class="panda-player">

<div class="panda-face" id="panda">
🐼🎧
</div>

<button onclick="toggleMusic()" id="musicBtn">
▶️ Play
</button>

<input 
type="range" 
id="volume"
min="0"
max="1"
step="0.1"
value="0.5">

<audio id="music" loop>
<source src="music/song.wav" type="audio/wav">
</audio>

</div>

<script src="script.js"></script>
</body>

</html>
