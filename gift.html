<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Secret Gift 🎁</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

<h1>Secret Gift 🎁</h1>

<div class="gift-box" onclick="openGift()">
🎁
</div>

<p id="giftText">
Tap the gift box 🐼✨
</p>

</div>

<script>

function openGift(){

let box = document.querySelector(".gift-box");

box.innerHTML="🎉💖";

document.getElementById("giftText").innerHTML =
"Surprise! A special gift for Aakriti Sister 🌸🐼";

}

</script>
<div class="panda-player">

<div class="panda-face" id="panda">
🐼🎧
</div>

<button onclick="toggleMusic()" id="musicBtn">
▶️ Play
</button>

<input 
type="range" 
id="volume"
min="0"
max="1"
step="0.1"
value="0.5">

<audio id="music" loop>
<source src="music/song.wav" type="audio/wav">
</audio>

</div>

<script src="script.js"></script>
</body>

</html>
